name: CI — Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────
  # Backend — pytest (Django + SQLite)
  # ───────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-tools.txt

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (for ast-parser tests)
        working-directory: frontend
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev

      - name: Verify and install locked Python dependencies
        run: |
          python -m pip install --requirement requirements-tools.txt
          cp requirements.txt /tmp/requirements.txt
          python -m piptools compile --generate-hashes --no-header --resolver=backtracking --strip-extras --output-file=/tmp/requirements.txt requirements.in
          diff --unified requirements.txt /tmp/requirements.txt
          python -m pip install --require-hashes --requirement requirements.txt
          pip-audit --require-hashes --disable-pip --progress-spinner=off --requirement requirements.txt

      - name: Verify Python dependencies and WSGI configuration
        env:
          DJANGO_SETTINGS_MODULE: base_feature_project.settings_dev
        run: |
          python -m pip check
          python manage.py check
          gunicorn --check-config base_feature_project.wsgi:application

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run pytest with coverage
        run: pytest -v --tb=short --junitxml=pytest-results.xml --cov=base_feature_app --cov-branch --cov-report=json:coverage-backend.json --cov-report=xml:coverage-backend.xml

      - name: Backend coverage summary
        if: always()
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/backend-job-summary.py" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-backend
          path: |
            backend/coverage-backend.json
            backend/pytest-results.xml
          retention-days: 5

  # ───────────────────────────────────────────
  # Frontend — Jest unit & component tests
  # ───────────────────────────────────────────
  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Verify frontend dependencies and build
        run: |
          npm audit --audit-level=high
          npm run check:install-scripts
          npm run lint
          npm run typecheck
          npm run typecheck:compat
          npm run build

      - name: Run Jest tests with coverage
        run: |
          NODE_OPTIONS='--no-deprecation' npx jest --config jest.config.cjs --coverage --ci --forceExit --json --outputFile=jest-results.json || true
          node scripts/coverage-summary.cjs
          # Fail the step if tests failed
          node -e "const r=require('./jest-results.json'); if(!r.success) process.exit(1);"

      - name: Copy test results alongside coverage
        if: always()
        run: cp jest-results.json coverage/ 2>/dev/null || true

      - name: Frontend unit coverage summary
        if: always()
        run: node "$GITHUB_WORKSPACE/scripts/ci/frontend-job-summary.cjs" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload frontend-unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend-unit
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/jest-results.json
          retention-days: 5

  # ───────────────────────────────────────────
  # Frontend — Playwright E2E tests
  # ───────────────────────────────────────────
  frontend-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev

      - name: Create backend venv and install deps
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/python -m pip install --require-hashes --requirement requirements.txt

      - name: Run backend migrations
        working-directory: backend
        run: venv/bin/python manage.py migrate --no-input

      - name: Seed E2E test data
        working-directory: backend
        run: venv/bin/python manage.py create_fake_data 5

      - name: Install Playwright browsers with system deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter='json,./e2e/reporters/flow-coverage-reporter.mjs'
        env:
          CI: 'true'
          PYTHON_DOTENV_DISABLED: '1'
          DJANGO_SETTINGS_MODULE: base_feature_project.settings_dev
          DJANGO_DB_ENGINE: django.db.backends.sqlite3
          DJANGO_DB_NAME: ${{ github.workspace }}/backend/db.sqlite3
          NEXT_PUBLIC_BACKEND_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_API_URL: /api
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/playwright-results.json

      - name: Upload E2E flow coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend-e2e
          path: |
            frontend/e2e-results/flow-coverage.json
            frontend/e2e-results/playwright-results.json
          retention-days: 5

      - name: Upload test traces (failures only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # ───────────────────────────────────────────
  # Coverage Summary — aggregates all reports
  # ───────────────────────────────────────────
  coverage-summary:
    if: always()
    needs: [backend-tests, frontend-unit-tests, frontend-e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-backend
          path: coverage-artifacts/backend
        continue-on-error: true

      - name: Download frontend-unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-frontend-unit
          path: coverage-artifacts/frontend-unit
        continue-on-error: true

      - name: Download frontend-e2e coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-frontend-e2e
          path: coverage-artifacts/frontend-e2e
        continue-on-error: true

      - name: Generate coverage summary
        if: always()
        id: summary
        run: node scripts/coverage-summary-ci.cjs

      - name: Write Job Summary
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report (md)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-md
          path: coverage-report.md
          retention-days: 5

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: coverage-report.md
